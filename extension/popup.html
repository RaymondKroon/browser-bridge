<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CDT Extension Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>CDT Bridge</h1>
      <section class="panel">
        <div class="row"><span>Native host</span><strong id="host-status">Starting...</strong></div>
        <div class="row"><span>Bridge</span><strong id="bridge-url">-</strong></div>
        <label class="field" for="bridge-port">
          <span>Port</span>
          <span class="field-control">
            <input id="bridge-port" type="number" min="0" max="65535" inputmode="numeric" value="9222">
            <button id="save-port-button" type="button" class="secondary">Save</button>
          </span>
        </label>
        <div class="row"><span>Last error</span><strong id="last-error">-</strong></div>
        <button id="connection-button" type="button">Connect</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
  </html>
